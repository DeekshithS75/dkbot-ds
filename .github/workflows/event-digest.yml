name: DK24 Event Digest

on:
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_API_TOKEN_BASE64: ${{ secrets.GMAIL_API_TOKEN_BASE64 }}
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL missing"; exit 1; }
          test -n "$GMAIL_API_TOKEN_BASE64" || { echo "GMAIL_API_TOKEN_BASE64 missing"; exit 1; }
          test -n "$UNSUBSCRIBE_URL" || { echo "UNSUBSCRIBE_URL missing"; exit 1; }